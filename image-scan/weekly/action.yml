name: image-scan weekly
description: Scan the per-architecture images of the latest release and keep one GitHub issue per critical/high CVE
inputs:
  image-repository:
    description: Image repository without tag, defaults to ghcr.io/<repository>. Scanned as <repository>:<release tag>-<architecture>
    required: false
    default: ghcr.io/${{ github.repository }}
  architectures:
    description: Space separated architectures to scan, every one must succeed before an issue is closed
    required: false
    default: amd64 arm64
  dockerhub-user:
    description: Docker Hub user, required by the scanner (pull of the scanner image and authentication)
    required: true
  dockerhub-password:
    description: Docker Hub password or personal access token
    required: true
  registry-user:
    description: User to read the images from their registry
    required: false
    default: ${{ github.actor }}
  registry-password:
    description: Password to read the images from their registry
    required: false
    default: ${{ github.token }}
  retries:
    description: Attempts for infrastructure failures per image
    required: false
    default: "3"
  vex-location:
    description: |
      File or directory (relative to the workspace, check out the repository first) of OpenVEX documents, see image-scan/gate. A CVE with a
      not_affected statement is not reported, so it opens no issue (and the open issue of a CVE that was not fixed but became suppressed
      is closed), and is listed in the job summary. Empty applies no document
    required: false
    default: ""
  vex-author:
    description: Regular expression of the VEX statement authors to accept, applies with vex-location
    required: false
    default: ".*"
  github-token:
    description: Token resolving the release and managing issues, needs the contents read and issues write permissions
    required: false
    default: ${{ github.token }}
outputs:
  slack-message:
    description: Multiline message listing the issues opened by this run, empty when none was opened
    value: ${{ steps.issues.outputs.slack-message }}
runs:
  using: composite
  steps:
    - name: Resolve the latest release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
        echo "Latest release: ${tag}"
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"

    # An infrastructure failure fails the job BEFORE any issue is touched: a partial scan must never close issues.
    - name: Scan the released images
      shell: bash
      env:
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        ARCHITECTURES: ${{ inputs.architectures }}
        TAG: ${{ steps.release.outputs.tag }}
        IMAGE_SCAN_DOCKERHUB_USER: ${{ inputs.dockerhub-user }}
        IMAGE_SCAN_DOCKERHUB_PASSWORD: ${{ inputs.dockerhub-password }}
        IMAGE_SCAN_REGISTRY_USER: ${{ inputs.registry-user }}
        IMAGE_SCAN_REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        IMAGE_SCAN_RETRIES: ${{ inputs.retries }}
        IMAGE_SCAN_VEX_LOCATION: ${{ inputs.vex-location }}
        IMAGE_SCAN_VEX_AUTHOR: ${{ inputs.vex-author }}
      run: ${{ github.action_path }}/scan.sh "$IMAGE_REPOSITORY" "$TAG" "$ARCHITECTURES" "${RUNNER_TEMP}/findings.json"

    - name: Sync the issues
      id: issues
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ steps.release.outputs.tag }}
      run: |
        message_file="${RUNNER_TEMP}/slack-message.txt"
        rm -f "$message_file"
        rc=0
        SLACK_MESSAGE_FILE="$message_file" ${{ github.action_path }}/issues.sh "$TAG" "${RUNNER_TEMP}/findings.json" || rc=$?

        # Written even when the sync failed halfway, issues already opened must still be announced
        delimiter="EOF_$(openssl rand -hex 8)"
        {
          echo "slack-message<<${delimiter}"
          if [[ -s "$message_file" ]]; then cat "$message_file"; fi
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"
        exit "$rc"
