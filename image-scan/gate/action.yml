name: image-scan gate
description: Fail the build when a container image has critical/high vulnerabilities (with per-CVE VEX exceptions and an advisory mode), report to the job summary and the pull request
inputs:
  image:
    description: |
      Image to scan, like ghcr.io/org/repo:1.2.3-amd64, already pushed to a registry the scanner can read (an image only in the runner's local Docker daemon is not found).
      Built from image-repository when empty, as <image-repository>:<tag name, or the first 7 characters of the commit>-<runner architecture>,
      the tags of the StreamingFast docker workflows
    required: false
    default: ""
  image-repository:
    description: Image repository without tag, used when image is empty
    required: false
    default: ghcr.io/${{ github.repository }}
  dockerhub-user:
    description: Docker Hub user, required by the scanner (pull of the scanner image and authentication)
    required: true
  dockerhub-password:
    description: Docker Hub password or personal access token
    required: true
  registry-user:
    description: User to read the image from its registry
    required: false
    default: ${{ github.actor }}
  registry-password:
    description: Password to read the image from its registry
    required: false
    default: ${{ github.token }}
  severities:
    description: Comma separated severities that fail the scan
    required: false
    default: critical,high
  retries:
    description: Attempts for infrastructure failures (login, pull, authentication, database fetch, registry calls of promote-tags). Findings are never retried
    required: false
    default: "3"
  scan-paths:
    description: |
      Newline separated extended regular expressions (anchor with ^). On a pull_request the scan is skipped unless a changed
      file matches one, the image build is the caller's and runs either way. Empty always scans. The caller must check out
      with fetch-depth: 2 so HEAD^1 (the base branch) exists
    required: false
    default: ""
  promote-tags:
    description: |
      Newline or comma separated full image refs (like the tags output of docker/metadata-action) added to the image once it is
      scanned clean, with a registry-side retag of the scanned digest (like docker buildx imagetools create), no rebuild, the multi-arch
      index and attestations are kept. Nothing is added when the scan finds vulnerabilities or cannot run. The tag equal to the image
      is skipped. Pushing only an immutable tag (like the commit sha) in the build, and the release tags here, makes the gate block
      the release. The runner must already be logged in to the registry of the image and of the tags (as the build requires, docker/login-action), the
      Docker config of the runner is mounted read-only into the action and the credentials are not passed to the scanner. Applies when scan-paths skips the scan too (a pull request)
    required: false
    default: ""
  skip-reason:
    description: |
      Audited emergency bypass. When set AND the workflow runs on workflow_dispatch, the scan is skipped (promote-tags still applies)
      and recorded: a warning, a job summary section and a GitHub issue (labels security and image-scan-skipped) with the image,
      its digest, the actor, this reason, the run URL and the time. On any other event the reason is ignored, with a warning,
      and the scan runs. Needs issues: write for the issue (a failure to open it only warns). Anyone who can dispatch the
      workflow can bypass the gate, protect the workflow with a GitHub environment requiring approval
    required: false
    default: ""
  vex-location:
    description: |
      File or directory (relative to the workspace, so the caller must check out the repository) of OpenVEX documents, like .github/vex/,
      a per-CVE risk acceptance. A statement with status not_affected suppresses its CVE: it no longer fails the scan, and is listed under
      "Suppressed by VEX" with its justification in the log, the job summary and the pull request comment. Other statuses (including
      under_investigation) suppress nothing. Read from the workspace, which the action mounts read-only. Every statement must link a risk-accepted issue
      and be removed when the fix ships. Empty applies no document
    required: false
    default: ""
  vex-author:
    description: Regular expression of the VEX statement authors to accept (docker scout --vex-author, whose own default only accepts docker.com authors). Applies with vex-location
    required: false
    default: ".*"
  enforce:
    description: |
      "true" fails the build on findings. "false" is advisory mode, for images whose dependencies cannot be fixed (an upstream fork):
      the scan and the report run as usual (summary, CVE table, pull request comment) but findings are warnings, the build does not fail,
      promote-tags always applies and the findings output tells the caller. An infrastructure failure of the scanner still fails
    required: false
    default: "true"
  github-token:
    description: Token posting the pull request comment (needs pull-requests write) and the issue of skip-reason (needs issues write). The comment is authored by the token owner, pass a bot user token to post as that user
    required: false
    default: ${{ github.token }}
  pull-token:
    description: Token pulling the image-scan container image (a private package of ghcr.io) with the user of the workflow actor, needs the packages read permission, and the package must grant the repository read access. Empty pulls without login
    required: false
    default: ${{ github.token }}
outputs:
  scanned:
    description: '"true" when the scan was needed and started, "false" when scan-paths or skip-reason skipped it, a failed scan fails the action anyway'
    value: ${{ steps.run.outputs.scanned }}
  findings:
    description: '"true" when the scan found vulnerabilities (not counting those suppressed by vex-location), which only reaches the caller with enforce: false (the action fails otherwise), "false" otherwise, also when the scan did not run'
    value: ${{ steps.run.outputs.findings || 'false' }}
  skipped:
    description: '"true" when skip-reason bypassed the scan (workflow_dispatch only), "false" otherwise'
    value: ${{ steps.run.outputs.skipped }}
  promoted:
    description: Newline separated tags added to the image by promote-tags, empty when none was
    value: ${{ steps.run.outputs.promoted }}
runs:
  using: composite
  steps:
    # One step: the program of the v2 container image does all of it (scope, skip, image, scan, report, promote), see image-scan/run.sh
    - name: Run the image-scan gate
      id: run
      shell: bash
      env:
        IMAGE_SCAN_IMAGE: ${{ inputs.image }}
        IMAGE_SCAN_IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        IMAGE_SCAN_DOCKERHUB_USER: ${{ inputs.dockerhub-user }}
        IMAGE_SCAN_DOCKERHUB_PASSWORD: ${{ inputs.dockerhub-password }}
        IMAGE_SCAN_REGISTRY_USER: ${{ inputs.registry-user }}
        IMAGE_SCAN_REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        IMAGE_SCAN_SEVERITIES: ${{ inputs.severities }}
        IMAGE_SCAN_RETRIES: ${{ inputs.retries }}
        IMAGE_SCAN_SCAN_PATHS: ${{ inputs.scan-paths }}
        IMAGE_SCAN_GITHUB_TOKEN: ${{ inputs.github-token }}
        IMAGE_SCAN_PROMOTE_TAGS: ${{ inputs.promote-tags }}
        IMAGE_SCAN_SKIP_REASON: ${{ inputs.skip-reason }}
        IMAGE_SCAN_VEX_LOCATION: ${{ inputs.vex-location }}
        IMAGE_SCAN_VEX_AUTHOR: ${{ inputs.vex-author }}
        IMAGE_SCAN_ENFORCE: ${{ inputs.enforce }}
        IMAGE_SCAN_PULL_TOKEN: ${{ inputs.pull-token }}
        IMAGE_SCAN_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: ${{ github.action_path }}/../run.sh gate
