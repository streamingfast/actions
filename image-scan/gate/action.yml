name: image-scan gate
description: Fail the build when a container image has critical/high vulnerabilities, report to the job summary and the pull request
inputs:
  image:
    description: |
      Image to scan, like ghcr.io/org/repo:1.2.3-amd64, already pushed to a registry the scanner can read (an image only in the runner's local Docker daemon is not found).
      Built from image-repository when empty, as <image-repository>:<tag name, or the first 7 characters of the commit>-<runner architecture>,
      the tags of the StreamingFast docker workflows
    required: false
    default: ""
  image-repository:
    description: Image repository without tag, used when image is empty
    required: false
    default: ghcr.io/${{ github.repository }}
  dockerhub-user:
    description: Docker Hub user, required by the scanner (pull of the scanner image and authentication)
    required: true
  dockerhub-password:
    description: Docker Hub password or personal access token
    required: true
  registry-user:
    description: User to read the image from its registry
    required: false
    default: ${{ github.actor }}
  registry-password:
    description: Password to read the image from its registry
    required: false
    default: ${{ github.token }}
  severities:
    description: Comma separated severities that fail the scan
    required: false
    default: critical,high
  retries:
    description: Attempts for infrastructure failures (login, pull, authentication, database fetch, registry calls of promote-tags). Findings are never retried
    required: false
    default: "3"
  scan-paths:
    description: |
      Newline separated extended regular expressions (anchor with ^). On a pull_request the scan is skipped unless a changed
      file matches one, the image build is the caller's and runs either way. Empty always scans. The caller must check out
      with fetch-depth: 2 so HEAD^1 (the base branch) exists
    required: false
    default: ""
  promote-tags:
    description: |
      Newline or comma separated full image refs (like the tags output of docker/metadata-action) added to the image once it is
      scanned clean, with docker buildx imagetools create: a registry-side retag of the scanned digest, no rebuild, the multi-arch
      index and attestations are kept. Nothing is added when the scan finds vulnerabilities or cannot run. The tag equal to the image
      is skipped. Pushing only an immutable tag (like the commit sha) in the build, and the release tags here, makes the gate block
      the release. The runner must already be logged in to the registry of the image and of the tags (as the build requires), the
      credentials are not passed to the scanner. Applies when scan-paths skips the scan too (a pull request)
    required: false
    default: ""
  github-token:
    description: Token posting the pull request comment, needs the pull-requests write permission. The comment is authored by the token owner, pass a bot user token to post as that user
    required: false
    default: ${{ github.token }}
outputs:
  scanned:
    description: '"true" when the scan was needed and started, "false" when scan-paths skipped it, a failed scan fails the action anyway'
    value: ${{ steps.scope.outputs.scan }}
  promoted:
    description: Newline separated tags added to the image by promote-tags, empty when none was
    value: ${{ steps.promote.outputs.promoted }}
runs:
  using: composite
  steps:
    - name: Check if the scan is needed
      id: scope
      shell: bash
      env:
        SCAN_PATHS: ${{ inputs.scan-paths }}
      run: ${{ github.action_path }}/scope.sh

    - name: Resolve the image
      id: image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
      run: ${{ github.action_path }}/image.sh

    - name: Resolve the digest of the image to promote
      id: digest
      if: inputs.promote-tags != ''
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.image }}
        IMAGE_SCAN_RETRIES: ${{ inputs.retries }}
      run: ${{ github.action_path }}/promote.sh resolve

    - name: Scan the image
      id: scan
      if: steps.scope.outputs.scan == 'true'
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.image }}
        IMAGE_SCAN_DOCKERHUB_USER: ${{ inputs.dockerhub-user }}
        IMAGE_SCAN_DOCKERHUB_PASSWORD: ${{ inputs.dockerhub-password }}
        IMAGE_SCAN_REGISTRY_USER: ${{ inputs.registry-user }}
        IMAGE_SCAN_REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        IMAGE_SCAN_SEVERITIES: ${{ inputs.severities }}
        IMAGE_SCAN_RETRIES: ${{ inputs.retries }}
      run: |
        report="$(mktemp "${RUNNER_TEMP}/image-scan-XXXXXX.md")"
        echo "report=${report}" >> "$GITHUB_OUTPUT"
        ${{ github.action_path }}/../lib/scanner.sh "$IMAGE" "$report"

    - name: Publish the scan report
      if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
      continue-on-error: true
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.image }}
        REPORT: ${{ steps.scan.outputs.report }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: ${{ github.action_path }}/comment.sh "$IMAGE" "$REPORT"

    # After the report, a clean scan (or no scan: scan-paths skipped it) is the only way to get here, a failed step stops the action
    - name: Promote the tags
      id: promote
      if: ${{ inputs.promote-tags != '' && (steps.scan.outcome == 'success' || steps.scope.outputs.scan == 'false') }}
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.image }}
        EXPECTED_DIGEST: ${{ steps.digest.outputs.digest }}
        PROMOTE_TAGS: ${{ inputs.promote-tags }}
        IMAGE_SCAN_RETRIES: ${{ inputs.retries }}
      run: ${{ github.action_path }}/promote.sh promote
