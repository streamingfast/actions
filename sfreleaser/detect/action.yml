name: sfreleaser detect
description: Install sfreleaser and detect the version a pull request releases from its changelog
inputs:
  sfreleaser-version:
    description: sfreleaser version to install, "latest" for the latest release
    required: false
    default: latest
  before:
    description: Git revision of the changelog to compare with, sfreleaser's default when empty
    required: false
    default: ""
outputs:
  version:
    description: Version to release, empty when nothing is released
    value: ${{ steps.detect.outputs.version }}
  is_release_pr:
    description: '"true" when a version is released, empty otherwise'
    value: ${{ steps.detect.outputs.is_release_pr }}
  preview_comment:
    description: Markdown announcing the version with its release notes
    value: ${{ steps.detect.outputs.preview_comment }}
runs:
  using: composite
  steps:
    - name: Install sfreleaser
      shell: bash
      env:
        SFRELEASER_VERSION: ${{ inputs.sfreleaser-version }}
      run: |
        curl_args=(-sSfL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120)
        version="$SFRELEASER_VERSION"
        if [[ "$version" == "latest" ]]; then
          latest=$(curl "${curl_args[@]}" -o /dev/null -w '%{url_effective}' "https://github.com/streamingfast/sfreleaser/releases/latest")
          version="${latest##*/}"
          echo "Resolved sfreleaser latest to $version"
        fi
        url="https://github.com/streamingfast/sfreleaser/releases/download/$version/sfreleaser_linux_x86_64.tar.gz"
        echo "Downloading sfreleaser $version from $url"
        start=$SECONDS
        curl "${curl_args[@]}" "$url" | tar -xz -C "$RUNNER_TEMP" sfreleaser
        echo "Installed $("$RUNNER_TEMP/sfreleaser" --version 2>/dev/null || echo "sfreleaser $version") in $((SECONDS - start))s"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Detect release PR
      id: detect
      shell: bash
      env:
        BEFORE: ${{ inputs.before }}
      run: sfreleaser release detect ${BEFORE:+--before "$BEFORE"}
