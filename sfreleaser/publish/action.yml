name: sfreleaser publish
description: Publish the release of a merged pull request and start the build workflow on its tag, runs after sfreleaser/detect
inputs:
  sfreleaser-version:
    description: sfreleaser version to install when sfreleaser/detect did not run (a re-run of the publish), "latest" for the latest release
    required: false
    default: latest
  version:
    description: Version to release, the version output of sfreleaser/detect
    required: true
  build-workflow:
    description: Workflow started on the tag, like docker.yml, none when empty
    required: false
    default: ""
  github-token:
    description: GitHub token
    required: false
    default: ${{ github.token }}
  homebrew-tap-token:
    description: Homebrew tap token
    required: false
    default: ""
  cargo-registry-token:
    description: crates.io token, the output of rust-lang/crates-io-auth-action for Trusted Publishing
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install sfreleaser
      shell: bash
      env:
        SFRELEASER_VERSION: ${{ inputs.sfreleaser-version }}
      run: |
        if command -v sfreleaser >/dev/null; then
          echo "Using already installed $(sfreleaser --version 2>&1 || echo "sfreleaser (version unknown)") at $(command -v sfreleaser)"
          exit 0
        fi
        curl_args=(-sSfL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120)
        version="$SFRELEASER_VERSION"
        if [[ "$version" == "latest" ]]; then
          latest=$(curl "${curl_args[@]}" -o /dev/null -w '%{url_effective}' "https://github.com/streamingfast/sfreleaser/releases/latest")
          version="${latest##*/}"
          echo "Resolved sfreleaser latest to $version"
        fi
        url="https://github.com/streamingfast/sfreleaser/releases/download/$version/sfreleaser_linux_x86_64.tar.gz"
        echo "Downloading sfreleaser $version from $url"
        start=$SECONDS
        curl "${curl_args[@]}" "$url" | tar -xz -C "$RUNNER_TEMP" sfreleaser
        echo "Installed $("$RUNNER_TEMP/sfreleaser" --version 2>/dev/null || echo "sfreleaser $version") in $((SECONDS - start))s"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Publish release
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        HOMEBREW_TAP_TOKEN: ${{ inputs.homebrew-tap-token }}
        CARGO_REGISTRY_TOKEN: ${{ inputs.cargo-registry-token }}
      run: sfreleaser release publish "$VERSION"

    - name: Start ${{ inputs.build-workflow }} on the tag
      if: inputs.build-workflow != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        WORKFLOW: ${{ inputs.build-workflow }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$VERSION"
